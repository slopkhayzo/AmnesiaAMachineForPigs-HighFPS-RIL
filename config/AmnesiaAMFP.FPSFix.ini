; AmnesiaAMFP.FPSFix configuration
; Keep this file beside AmnesiaAMFP.FPSFix.asi.

[General]
Enabled = true
; Startup, compatibility, and exit-summary lines in AmnesiaAMFP.FPSFix.log.
; Nothing is written while playing.
Diagnostics = true

[Telemetry]
; Periodic counters every ReportIntervalSeconds. Useful when reporting a
; problem; leave disabled for normal play because it costs some frame rate.
Enabled = false
ReportIntervalSeconds = 5

; RenderUnlock removes only the engine's presentation gate. Simulation stays
; on the original fixed 60 Hz timer. Use VSync or an external frame-rate cap.
[Features]
RenderUnlock = true
CameraInterpolation = true
; First-person hands and lantern, with their lights and attachments.
HandsRootInterpolation = true
HandsPoseInterpolation = true
; Physics props: loose objects, doors, drawers, levers, and wheels.
WorldRootInterpolation = true
; Machinery driven by node animation, such as fans.
NodeAnimationInterpolation = true
; Animation and movement of Pig Men and the ghost children.
EnemyPoseInterpolation = true
; Ragdolls and other skeleton-physics meshes.
RagdollPoseInterpolation = true
; Smoke, steam, sparks, dust, and other particles.
ParticleInterpolation = true
; Keeps flashback afterimages at their original 60 Hz strength and duration.
ImageTrailTiming = true
; Presentation-rate mouse look. Needs CameraInterpolation. Smoothed, scripted,
; and restricted look modes stay engine-owned.
MouseOverlay = true
; Presentation-rate menu and journal cursor. Needs MouseOverlay.
GuiCursorOverlay = true
